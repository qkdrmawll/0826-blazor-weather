name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore WeatherDashboard.sln

      - name: Build
        run: dotnet build WeatherDashboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WeatherDashboard.sln --configuration Release --no-build --verbosity normal
